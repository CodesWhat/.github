name: Reusable Node CI

on:
  workflow_call:
    inputs:
      module-directory:
        description: Repository-relative Node module directory
        required: false
        type: string
        default: .
      node-version:
        description: Node.js version used by enabled jobs
        required: false
        type: string
        default: 24
      lockfile-path:
        description: Repository-relative npm lockfile path or multiline paths
        required: false
        type: string
        default: package-lock.json
      lint-check-name:
        description: Exact display name for the Node lint job
        required: false
        type: string
        default: Node Lint
      test-check-name:
        description: Exact display name for the Node test job
        required: false
        type: string
        default: Node Test
      build-check-name:
        description: Exact display name for the Node build job
        required: false
        type: string
        default: Node Build
      run-lint:
        description: Run the fixed repository Node lint gate
        required: false
        type: boolean
        default: false
      run-test:
        description: Run the fixed repository Node test gate
        required: false
        type: boolean
        default: false
      run-build:
        description: Run the fixed repository Node build gate
        required: false
        type: boolean
        default: false
      lint-egress-policy:
        description: Harden Runner egress policy for Node lint
        required: false
        type: string
        default: audit
      lint-allowed-endpoints:
        description: Harden Runner allowlist for Node lint
        required: false
        type: string
        default: ""
      test-egress-policy:
        description: Harden Runner egress policy for Node test
        required: false
        type: string
        default: audit
      test-allowed-endpoints:
        description: Harden Runner allowlist for Node test
        required: false
        type: string
        default: ""
      build-egress-policy:
        description: Harden Runner egress policy for Node build
        required: false
        type: string
        default: audit
      build-allowed-endpoints:
        description: Harden Runner allowlist for Node build
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: ${{ inputs.lint-check-name }}
    if: inputs.run-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.lint-egress-policy }}
          allowed-endpoints: ${{ inputs.lint-allowed-endpoints }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path }}

      - name: Run repository Node lint gate
        env:
          MODULE_DIRECTORY: ${{ inputs.module-directory }}
        run: ./scripts/ci/node-lint.sh

  test:
    name: ${{ inputs.test-check-name }}
    if: inputs.run-test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.test-egress-policy }}
          allowed-endpoints: ${{ inputs.test-allowed-endpoints }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path }}

      - name: Run repository Node test gate
        env:
          MODULE_DIRECTORY: ${{ inputs.module-directory }}
        run: ./scripts/ci/node-test.sh

      - name: Upload Node test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/node-test/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: ${{ inputs.build-check-name }}
    if: inputs.run-build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.build-egress-policy }}
          allowed-endpoints: ${{ inputs.build-allowed-endpoints }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path }}

      - name: Run repository Node build gate
        env:
          MODULE_DIRECTORY: ${{ inputs.module-directory }}
        run: ./scripts/ci/node-build.sh

      - name: Upload Node build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/node-build/
          if-no-files-found: ignore
          retention-days: 14
