name: Standards Validation

on:
  pull_request:
    branches:
      - main
      - dev/repository-standards

permissions: {}

concurrency:
  group: standards-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Standards Validation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read  # Read workflow metadata
      contents: read  # Check out and validate repository files

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Validate community health contract
        run: |
          python3 .github/tests/community_health_contract_test.py
          python3 .github/tests/greptile_summon_contract_test.py
          python3 .github/tests/tracked_validation_test.py
          python3 .github/tests/changes_gate_contract_test.py
          python3 .github/tests/tree_receipt_contract_test.py
          python3 .github/tests/test_wiring_contract_test.py

      - name: Compile Python
        run: python3 scripts/validate_tracked_files.py python

      - name: Parse YAML and JSON
        run: |
          set -euo pipefail
          python3 scripts/validate_tracked_files.py data
          python3 .github/tests/greptile_config_contract_test.py
          python3 .github/tests/quality_report_contract_test.py
          python3 .github/tests/reusable_ci_contract_test.py
          python3 .github/tests/renovate_config_contract_test.py
          python3 .github/tests/starchart_refresh_contract_test.py
          python3 .github/tests/main_is_released_contract_test.py

      - name: Lint Markdown
        run: |
          set -euo pipefail
          python3 scripts/validate_tracked_files.py markdown

      - name: Validate workflows with actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Validate workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          collect: workflows
          inputs: .github/workflows/
          online-audits: false

  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read  # Read workflow metadata
      contents: read  # Check out Python sources
      security-events: write  # Upload CodeQL analysis

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:python
