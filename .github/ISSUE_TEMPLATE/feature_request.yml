name: Feature request
description: Propose a focused improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and pull requests before proposing a feature. Describe the need before the implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case or limitation should this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want and who benefits from it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security
      description: Note migration, breaking-change, privacy, or security effects.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, screenshots, or links that clarify the request.
