name: Question or help
description: Ask about setup, usage, or project behavior
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README, documentation, and existing issues first. Email security@codeswhat.com instead of asking publicly about a suspected vulnerability.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to understand or accomplish?
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include the relevant documentation and commands you used.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit SHA when relevant.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted configuration, logs, screenshots, or links.
